<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>api_rest - Documentação</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
  <script>
    const spec = {
      openapi: "3.0.0",
      info: {
        title: "api_rest",
        version: "1.0.0",
        description: "API para gerenciamento de usuários, alunos e fotos"
      },
      servers: [
        {
          url: "http://localhost:3001",
          description: "Servidor local"
        }
      ],
      components: {
        securitySchemes: {
          bearerAuth: {
            type: "http",
            scheme: "bearer",
            bearerFormat: "JWT"
          }
        }
      },
      tags: [
        { name: "Tokens", description: "Autenticação de usuários" },
        { name: "Users", description: "Gerenciamento de usuários" },
        { name: "Alunos", description: "Gerenciamento de alunos" },
        { name: "Photos", description: "Upload de fotos dos alunos" },
        { name: "Home", description: "Rota inicial da API" }
      ],
      paths: {
        "/": {
          get: {
            summary: "Rota inicial - verifica se a API está rodando",
            tags: ["Home"],
            responses: {
              "200": { description: "API funcionando corretamente" }
            }
          }
        },
        "/tokens": {
          post: {
            summary: "Realiza login e gera um token de autenticação",
            description: "Use as credenciais de demonstração: email **demo@teste.com**, senha **123456**",
            tags: ["Tokens"],
            requestBody: {
              required: true,
              content: {
                "application/json": {
                  schema: {
                    type: "object",
                    required: ["email", "password"],
                    properties: {
                      email: { type: "string", example: "demo@teste.com" },
                      password: { type: "string", example: "123456" }
                    }
                  }
                }
              }
            },
            responses: {
              "200": {
                description: "Token gerado com sucesso",
                content: {
                  "application/json": {
                    schema: {
                      type: "object",
                      properties: {
                        token: { type: "string" }
                      }
                    }
                  }
                }
              },
              "401": { description: "Credenciais inválidas" }
            }
          }
        },
        "/users": {
          get: {
            summary: "Lista todos os usuários",
            tags: ["Users"],
            responses: {
              "200": { description: "Lista de usuários retornada com sucesso" }
            }
          },
          post: {
            summary: "Cria um novo usuário (requer autenticação)",
            description: "Use o token do usuário demo para testar (login em /tokens com demo@teste.com / 123456)",
            tags: ["Users"],
            security: [{ bearerAuth: [] }],
            requestBody: {
              required: true,
              content: {
                "application/json": {
                  schema: {
                    type: "object",
                    required: ["nome", "email", "password"],
                    properties: {
                      nome: { type: "string", example: "João Silva" },
                      email: { type: "string", example: "joao@email.com" },
                      password: { type: "string", example: "senha123" }
                    }
                  }
                }
              }
            },
            responses: {
              "200": { description: "Usuário criado com sucesso" },
              "401": { description: "Não autorizado" }
            }
          },
          put: {
            summary: "Edita o usuário autenticado (só pode editar a si mesmo)",
            tags: ["Users"],
            security: [{ bearerAuth: [] }],
            requestBody: {
              required: true,
              content: {
                "application/json": {
                  schema: {
                    type: "object",
                    properties: {
                      nome: { type: "string", example: "João Silva" },
                      email: { type: "string", example: "joao@email.com" },
                      password: { type: "string", example: "novaSenha123" }
                    }
                  }
                }
              }
            },
            responses: {
              "200": { description: "Usuário atualizado com sucesso" },
              "401": { description: "Não autorizado" }
            }
          },
          delete: {
            summary: "Deleta o usuário autenticado (só pode deletar a si mesmo)",
            tags: ["Users"],
            security: [{ bearerAuth: [] }],
            responses: {
              "200": { description: "Usuário deletado com sucesso" },
              "401": { description: "Não autorizado" }
            }
          }
        },
        "/users/{id}": {
          get: {
            summary: "Mostra um usuário específico",
            tags: ["Users"],
            parameters: [
              {
                in: "path",
                name: "id",
                required: true,
                schema: { type: "integer" }
              }
            ],
            responses: {
              "200": { description: "Usuário encontrado" },
              "404": { description: "Usuário não encontrado" }
            }
          }
        },
        "/alunos": {
          get: {
            summary: "Lista todos os alunos",
            tags: ["Alunos"],
            responses: {
              "200": { description: "Lista de alunos retornada com sucesso" }
            }
          },
          post: {
            summary: "Cria um novo aluno (requer autenticação)",
            description: "Use o token do usuário demo para testar (login em /tokens com demo@teste.com / 123456)",
            tags: ["Alunos"],
            security: [{ bearerAuth: [] }],
            requestBody: {
              required: true,
              content: {
                "application/json": {
                  schema: {
                    type: "object",
                    required: ["nome", "sobrenome", "email", "idade", "peso", "altura"],
                    properties: {
                      nome: { type: "string", example: "Maria" },
                      sobrenome: { type: "string", example: "Souza" },
                      email: { type: "string", example: "maria@email.com" },
                      idade: { type: "integer", example: 20 },
                      peso: { type: "number", example: 65.5 },
                      altura: { type: "number", example: 1.70 }
                    }
                  }
                }
              }
            },
            responses: {
              "200": { description: "Aluno criado com sucesso" },
              "401": { description: "Não autorizado" }
            }
          }
        },
        "/alunos/{id}": {
          get: {
            summary: "Mostra um aluno específico",
            tags: ["Alunos"],
            parameters: [
              {
                in: "path",
                name: "id",
                required: true,
                schema: { type: "integer" }
              }
            ],
            responses: {
              "200": { description: "Aluno encontrado" },
              "404": { description: "Aluno não encontrado" }
            }
          },
          put: {
            summary: "Edita um aluno (requer autenticação)",
            tags: ["Alunos"],
            security: [{ bearerAuth: [] }],
            parameters: [
              {
                in: "path",
                name: "id",
                required: true,
                schema: { type: "integer" }
              }
            ],
            requestBody: {
              required: true,
              content: {
                "application/json": {
                  schema: {
                    type: "object",
                    properties: {
                      nome: { type: "string", example: "Maria" },
                      sobrenome: { type: "string", example: "Souza" },
                      email: { type: "string", example: "maria@email.com" },
                      idade: { type: "integer", example: 21 },
                      peso: { type: "number", example: 66.0 },
                      altura: { type: "number", example: 1.70 }
                    }
                  }
                }
              }
            },
            responses: {
              "200": { description: "Aluno atualizado com sucesso" },
              "401": { description: "Não autorizado" },
              "404": { description: "Aluno não encontrado" }
            }
          },
          delete: {
            summary: "Deleta um aluno (requer autenticação)",
            tags: ["Alunos"],
            security: [{ bearerAuth: [] }],
            parameters: [
              {
                in: "path",
                name: "id",
                required: true,
                schema: { type: "integer" }
              }
            ],
            responses: {
              "200": { description: "Aluno deletado com sucesso" },
              "401": { description: "Não autorizado" },
              "404": { description: "Aluno não encontrado" }
            }
          }
        },
        "/photos": {
          post: {
            summary: "Adiciona uma foto a um aluno (requer autenticação)",
            description: "Use o token do usuário demo para testar (login em /tokens com demo@teste.com / 123456). Um aluno pode ter várias fotos.",
            tags: ["Photos"],
            security: [{ bearerAuth: [] }],
            requestBody: {
              required: true,
              content: {
                "multipart/form-data": {
                  schema: {
                    type: "object",
                    required: ["photo", "aluno_id"],
                    properties: {
                      photo: { type: "string", format: "binary" },
                      aluno_id: { type: "integer", example: 1 }
                    }
                  }
                }
              }
            },
            responses: {
              "200": { description: "Foto cadastrada com sucesso" },
              "400": { description: "Erro no upload ou aluno não existe" },
              "401": { description: "Não autorizado" }
            }
          }
        }
      }
    };

    SwaggerUIBundle({
      spec,
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: "BaseLayout",
      deepLinking: true,
      displayRequestDuration: true,
      tryItOutEnabled: false
    });
  </script>
</body>
</html>
